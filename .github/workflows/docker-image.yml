name: Docker Image CI

env:
  ACT: debug

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Erlaubt das Pushen zu GHCR

    steps:
      - name: Debug variables
        run: |
          echo "Registry: ghcr.io"
          echo "Username: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Token: ${{ secrets.GITHUB_TOKEN }}"
      - name: Convert and store lowercase
        run: |
          UPPERCASE_STRING="${{ github.repository_owner }}"
          LOWERCASE_STRING=$(echo "$UPPERCASE_STRING" | tr '[:upper:]' '[:lower:]')
          echo "LOWERCASE_STRING=$LOWERCASE_STRING" >> $GHCR_REPOSITORY_OWNER  # Speichere in Umgebungsvariablen

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build . --file Dockerfile --tag ghcr.io/${{ github.repository_owner }}/ytdlp_alpine:latest
          docker push ghcr.io/$GHCR_REPOSITORY_OWNER/ytdlp_alpine:latest
