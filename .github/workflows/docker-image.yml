name: Docker Image CI

env:
  ACT: debug

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Erlaubt das Pushen zu GHCR
    
    steps:
      - name: Debug variables
        run: |
          echo "Registry: ghcr.io"
          echo "Username: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Token: ${{ secrets.GITHUB_TOKEN }}"
          echo "ghcr Token: ${{ secrets.GHCR_TOKEN }}"
          
          
      
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build . --file Dockerfile --tag ghcr.io/widukind42/ytdlp_alpine:latest 
          docker push ghcr.io/widukind42/ytdlp_alpine:latest

      - name: Container starten und Skript ausführen (Alpine)
        run: |
          echo "### Package Inventory (Stand: $(date +"%Y-%m-%d %H:%M:%S %Z"))" > ./PackageInventory.md
          podman run --rm \
            -v "$(pwd):/out:z" \
            --entrypoint /bin/sh \
            ghcr.io/widukind42/ytdlp_alpine \
            ./.github/scripts/show-container-releases.sh >> ./PackageInventory.md

      - name: Änderungen commiten
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ./PackageInventory.md
          git commit -m "Update release info [skip ci]"
          git push    
 
