name: Docker Image CI

env:
  ACT: debug

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Erlaubt das Pushen zu GHCR
    env:
      REPOSITORY_OWNER_LOWER: ${{ toLower(github.repository_owner) }}
    steps:
      - name: Debug variables
        run: |
          echo "Registry: ghcr.io"
          echo "Username: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Token: ${{ secrets.GITHUB_TOKEN }}"
          echo "ghcr Token: ${{ secrets.GHCR_TOKEN }}"
          echo "Repository Owner lowercase: $REPOSITORY_OWNER_LOWER"
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build . --file Dockerfile --tag ghcr.io/widukind42/ytdlp_alpine:latest 
          docker push ghcr.io/widukind42/ytdlp_alpine:latest
