name: Alpine Linux Update Check

on:
  schedule:
    # Täglich um 06:00 UTC prüfen
    - cron: '0 6 1,15 * *'
  workflow_dispatch:  # Manuell auslösbar

jobs:
  check-alpine-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Check Alpine version
        id: check
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Aktuelle Alpine-Version aus Dockerfile abrufen
          CURRENT_VERSION=$(grep -oP 'FROM alpine:\K[^ ]+' Dockerfile || true)
          echo "Current version in Dockerfile: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Versuche zuerst das alte tags/list endpoint
          TAGS_JSON=$(curl -sS https://registry.hub.docker.com/v2/library/alpine/tags/list 2>/dev/null || true)

          if echo "$TAGS_JSON" | jq -e '.tags' >/dev/null 2>&1; then
            LATEST_VERSION=$(echo "$TAGS_JSON" | jq -r '.tags[]? | select(test("^[0-9]+\\.[0-9]+$"))' 2>/dev/null | sort -V | tail -1 || true)
          else
            # Fallback auf das repositories listing (paginiert, erste Seite)
            TAGS_JSON=$(curl -sS "https://registry.hub.docker.com/v2/repositories/library/alpine/tags?page_size=100" 2>/dev/null || true)
            LATEST_VERSION=$(echo "$TAGS_JSON" | jq -r '.results[]?.name | select(test("^[0-9]+\\.[0-9]+$"))' 2>/dev/null | sort -V | tail -1 || true)
          fi

          # Falls jq oder die API fehlgeschlagen ist, LATEST_VERSION leer lassen
          if [ -z "${LATEST_VERSION:-}" ]; then
            echo "Warning: could not determine latest Alpine version from Docker Hub. Not creating a PR."
            echo "Latest Alpine version could not be determined." >&2
            echo "latest_version=" >> $GITHUB_OUTPUT
            echo "update_available=false" >> $GITHUB_OUTPUT
          else
            echo "Latest Alpine version: $LATEST_VERSION"
            echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

            # Vergleichen und update_available nur setzen, wenn LATEST_VERSION gefunden wurde
            if [ "${CURRENT_VERSION}" != "${LATEST_VERSION}" ]; then
              echo "update_available=true" >> $GITHUB_OUTPUT
            else
              echo "update_available=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Update Dockerfile
        if: steps.check.outputs.update_available == 'true'
        run: |
          CURRENT=${{ steps.check.outputs.current_version }}
          LATEST=${{ steps.check.outputs.latest_version }}
          sed -i "s/FROM alpine:${CURRENT}/FROM alpine:${LATEST}/" Dockerfile
          echo "✅ Dockerfile updated: alpine:${CURRENT} → alpine:${LATEST}"
      
      - name: Create Pull Request
        if: steps.check.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'deps: update Alpine Linux to ${{ steps.check.outputs.latest_version }}'
          title: 'chore: update Alpine Linux to ${{ steps.check.outputs.latest_version }}'
          body: |
            ## Alpine Linux Update
            
            **Current version:** `${{ steps.check.outputs.current_version }}`
            **New version:** `${{ steps.check.outputs.latest_version }}`
            
            This PR automatically updates the Alpine Linux base image to the latest stable version.
            
            ✅ Please review and test before merging.
          branch: alpine-update/${{ steps.check.outputs.latest_version }}
          delete-branch: true
          labels: dependencies, alpine
          assignees: Widukind42
      
      - name: No update needed
        if: steps.check.outputs.update_available != 'true'
        run: |
          echo "✅ Kein Update nötig (alpine:${{ steps.check.outputs.current_version }} ist aktuell oder die neueste Version konnte nicht ermittelt werden)"

      - name: Summary
        run: |
          echo "## Alpine Update Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Current Version | ${{ steps.check.outputs.current_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest Version | ${{ steps.check.outputs.latest_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Update Available | ${{ steps.check.outputs.update_available }} |" >> $GITHUB_STEP_SUMMARY
